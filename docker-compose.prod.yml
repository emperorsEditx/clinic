# Production stack for the VPS. Copied to $DEPLOY_PATH by the GitHub Actions deploy job.
# Reads Laravel settings from ./.env (same directory). The shared MySQL server and the
# SSL reverse proxy live outside this file, on the external Docker network below.

x-app: &app
  image: ${CLINIC_IMAGE:-ghcr.io/emperorseditx/clinic}:${IMAGE_TAG:-latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - clinic-storage:/var/www/html/storage/app
    - clinic-logs:/var/www/html/storage/logs
    - clinic-backups:/var/www/html/storage/backups
  networks:
    - shared

services:
  app:
    <<: *app
    environment:
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "false"   # migrations run explicitly by the deploy job
      # For nginx-proxy + acme-companion setups (ignored by other proxies):
      VIRTUAL_HOST: ${CLINIC_DOMAIN:-}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${CLINIC_DOMAIN:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8080"   # for a host-level proxy (nginx/Caddy) — not exposed publicly
    networks:
      shared:
        aliases: [clinic-app]
    healthcheck:
      test: ["CMD", "healthcheck-fpm"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=3"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 20s
    depends_on: [app]

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 20s
    depends_on: [app]

volumes:
  clinic-storage:
  clinic-logs:
  clinic-backups:

networks:
  shared:
    name: ${DOCKER_NETWORK:-web}
    external: true
